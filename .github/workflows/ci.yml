name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned by commit SHA: a moved tag must not be able to change what runs
      # in a workflow that builds a security package (docs/ThreatModel.md T7).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # hatch-vcs derives the version from tags, so a shallow clone yields the wrong one.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Types
        run: uv run --frozen mypy

      - name: Tests
        run: uv run --frozen pytest --cov --cov-report=term-missing

      - name: Static security analysis
        run: uv run --frozen bandit -c pyproject.toml -q -r src

      - name: Dependency audit
        run: uv run --frozen pip-audit --skip-editable

      - name: Build
        run: uv build
